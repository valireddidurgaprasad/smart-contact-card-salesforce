
<template>
    <lightning-card title="Smart Contact Card" icon-name="standard:contact">
        <div class="slds-p-around_medium">

            <template lwc:if={profile}>
                <div class="slds-text-align_center">
                    <h1 class="slds-text-heading_large">
                        {profile.Full_Name__c}
                    </h1>
                    <p class="slds-text-heading_small">
                        {profile.Job_Title__c}
                    </p>
                    <p>{profile.Email__c}</p>
                    <p>{profile.Phone__c}</p>
                    <p>{profile.About_Me__c}</p>

                    <template lwc:if={profile.LinkedIn_URL__c}>
                        <p>
                            <a href={profile.LinkedIn_URL__c}
                               target="_blank"
                               rel="noopener noreferrer">
                                LinkedIn Profile
                            </a>
                        </p>
                    </template>

                    <template lwc:if={profile.GitHub_URL__c}>
                        <p>
                            <a href={profile.GitHub_URL__c}
                               target="_blank"
                               rel="noopener noreferrer">
                                GitHub Profile
                            </a>
                        </p>
                    </template>

                    <template lwc:if={profile.Portfolio_URL__c}>
                        <p>
                            <a href={profile.Portfolio_URL__c}
                               target="_blank"
                               rel="noopener noreferrer">
                                Portfolio
                            </a>
                        </p>
                    </template>
                </div>

                <lightning-layout multiple-rows class="slds-m-top_large">
                    <lightning-layout-item size="12">
                        <h2 class="slds-text-heading_medium">Skills</h2>
                        <template for:each={skills} for:item="skill">
                            <p key={skill.Id}>
                                {skill.Skill_Name__c} — {skill.Skill_Level__c}
                            </p>
                        </template>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" class="slds-m-top_medium">
                        <h2 class="slds-text-heading_medium">Projects</h2>
                        <template for:each={projects} for:item="project">
                            <div key={project.Id} class="slds-m-bottom_small">
                                <strong>{project.Project_Name__c}</strong>
                                <p>{project.Description__c}</p>
                                <p>{project.Technologies__c}</p>
                                <template lwc:if={project.Project_URL__c}>
                                    <a href={project.Project_URL__c}
                                       target="_blank"
                                       rel="noopener noreferrer">
                                        View Project
                                    </a>
                                </template>
                            </div>
                        </template>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" class="slds-m-top_medium">
                        <h2 class="slds-text-heading_medium">Certifications</h2>
                        <template for:each={certifications} for:item="cert">
                            <div key={cert.Id} class="slds-m-bottom_small">
                                <strong>{cert.Certification_Name__c}</strong>
                                <p>{cert.Issuing_Organization__c}</p>
                                <template lwc:if={cert.Credential_URL__c}>
                                    <a href={cert.Credential_URL__c}
                                       target="_blank"
                                       rel="noopener noreferrer">
                                        View Credential
                                    </a>
                                </template>
                            </div>
                        </template>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

            <template lwc:else>
                <p>Select a Professional Profile record to display its details.</p>
            </template>
        </div>
    </lightning-card>
</template>
